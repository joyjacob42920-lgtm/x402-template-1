services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paid
      POSTGRES_PASSWORD: paid
      POSTGRES_DB: paid_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://paid:paid@db:5432/paid_api
      PAID_BY_DEFAULT: "true"
      ADMIN_TOKEN: local-dev-admin
    depends_on:
      - db
volumes:
  pgdata:
